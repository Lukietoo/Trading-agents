[project]
name = "dashboard-backend"
version = "0.1.0"
description = "FastAPI service exposing the paper trading dashboard snapshot from the Alpaca paper API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # Declared explicitly now that app.decisions.schema depends on it directly,
    # rather than relying on it arriving transitively through FastAPI.
    "pydantic>=2.0",
    # app.config reads the root .env directly, so a scheduled entry point does
    # not need a shell to source it first.
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Subpackages are not implied by "app" — each one is listed explicitly.
packages = ["app", "app.decisions"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults are pyflakes plus core pycodestyle. Added on top: import
# ordering, modern-syntax upgrades, likely-bug checks, and comprehension and
# return-path cleanups. No formatter is configured — `ruff check` only.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows are deliberately one-per-line so a worked example reads as a
# table; wrapping them to fit the line length makes them harder to scan.
"tests/*" = ["E501"]
