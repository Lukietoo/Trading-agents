[project]
name = "dashboard-backend"
version = "0.1.0"
description = "FastAPI service exposing the paper trading dashboard snapshot from the Alpaca paper API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # Declared explicitly now that app.decisions.schema depends on it directly,
    # rather than relying on it arriving transitively through FastAPI.
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Subpackages are not implied by "app" — each one is listed explicitly.
packages = ["app", "app.decisions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
