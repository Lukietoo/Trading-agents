[project]
name = "dashboard-backend"
version = "0.1.0"
description = "FastAPI service exposing the paper trading dashboard snapshot from the Alpaca paper API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # Declared explicitly now that app.decisions.schema depends on it directly,
    # rather than relying on it arriving transitively through FastAPI.
    "pydantic>=2.0",
    # app.config reads the root .env directly, so a scheduled entry point does
    # not need a shell to source it first.
    "pydantic-settings>=2.0",
    # Bar series are DataFrames: it is what the indicators consume and what
    # TA-Lib wraps.
    "pandas>=2.2",
    # Indicators. Chosen over pandas-ta in the phase spec; 0.7.1 ships prebuilt
    # cp313 wheels for macOS arm64 and win_amd64, so neither machine needs a C
    # toolchain. Verified installing from a wheel here.
    "TA-Lib>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # The data-layer clients are async, so their tests are coroutines. Configured
    # in asyncio_mode = "auto" below, which is why no test carries a marker.
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Subpackages are not implied by "app" — each one is listed explicitly.
packages = ["app", "app.decisions", "app.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" so an async test needs no marker. The alternative, marking every one,
# is noise on a suite where async is the norm rather than the exception.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults are pyflakes plus core pycodestyle. Added on top: import
# ordering, modern-syntax upgrades, likely-bug checks, and comprehension and
# return-path cleanups. No formatter is configured — `ruff check` only.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows are deliberately one-per-line so a worked example reads as a
# table; wrapping them to fit the line length makes them harder to scan.
"tests/*" = ["E501"]
